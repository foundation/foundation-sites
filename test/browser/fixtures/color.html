<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Color fixture</title>
	<link rel="stylesheet" href="../../../src/yeti.css">
	<style>
		body { background-color: var(--yeti-color-surface); color: var(--yeti-color-text); }
		#page { background: var(--yeti-color-surface); color: var(--yeti-color-text); }
		#muted { background: var(--yeti-color-surface); color: var(--yeti-color-text-muted); }
		#primary { background: var(--yeti-color-primary); color: var(--yeti-on-primary); }
		#secondary { background: var(--yeti-color-secondary); color: var(--yeti-on-secondary); }
		#success { background: var(--yeti-color-success); color: var(--yeti-on-success); }
		#warning { background: var(--yeti-color-warning); color: var(--yeti-on-warning); }
		#alert { background: var(--yeti-color-alert); color: var(--yeti-on-alert); }
		#primary-text { background: var(--yeti-color-surface); color: var(--yeti-color-primary-text); }
		#subtle { background: var(--yeti-color-primary-subtle); color: var(--yeti-color-text); }
		#forced { color-scheme: light; background: var(--yeti-color-surface); color: var(--yeti-color-text); }
	</style>
</head>
<body>
	<main>
		<h1>Color fixture</h1>
		<p id="page">page</p>
		<p id="muted">muted</p>
		<p id="primary">primary</p>
		<p id="secondary">secondary</p>
		<p id="success">success</p>
		<p id="warning">warning</p>
		<p id="alert">alert</p>
		<p id="primary-text">primary text</p>
		<p id="subtle">subtle</p>
		<p id="forced">forced light</p>
	</main>
</body>
</html>
