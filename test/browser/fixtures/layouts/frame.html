<html lang="en">

	<title>Frame fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>

<body>
	<main>
		<h1>Frame</h1>

			</div>
			<div class="frame item" id="square" data-ratio="1/1" style="inline-size: 200px">
				<p id="placeholder">No image</p>
			</div>
		</div>
	</main>
</body>
