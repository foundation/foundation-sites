<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Masonry fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Masonry</h1>
		<div id="stage">
			<div class="masonry" id="masonry">
				<div class="item" style="block-size: 120px">1</div>
				<div class="item" style="block-size: 60px">2</div>
				<div class="item" style="block-size: 180px">3</div>
				<div class="item" style="block-size: 90px">4</div>
				<div class="item" style="block-size: 150px">5</div>
				<div class="item" style="block-size: 70px">6</div>
				<div class="item" style="block-size: 110px">7</div>
				<div class="item" style="block-size: 80px">8</div>
			</div>
			<div class="masonry" id="capped" data-columns="2">
				<div class="item" id="c1" style="block-size: 120px">1</div>
				<div class="item" id="c2" style="block-size: 60px">2</div>
				<div class="item" id="c3" style="block-size: 180px">3</div>
				<div class="item" id="c4" style="block-size: 90px">4</div>
				<div class="item" id="c5" style="block-size: 150px">5</div>
				<div class="item" id="c6" style="block-size: 70px">6</div>
				<div class="item" id="c7" style="block-size: 110px">7</div>
				<div class="item" id="c8" style="block-size: 80px">8</div>
			</div>
		</div>
	</main>
</body>
</html>
