<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Timeline fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; } .timeline li { background: var(--yeti-color-primary-soft); padding-block: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Timeline</h1>
		<div id="stage">
			<ol class="timeline" id="single" role="list">
				<li id="s1"><time datetime="2026-01-01">January</time><p>One</p></li>
				<li id="s2"><time datetime="2026-02-01">February</time><p>Two</p></li>
				<li id="s3"><time datetime="2026-03-01">March</time><p>Three</p></li>
			</ol>
			<ol class="timeline" id="alt" data-alternate role="list">
				<li id="a1"><time datetime="2026-01-01">January</time><p>One</p></li>
				<li id="a2"><time datetime="2026-02-01">February</time><p>Two</p></li>
				<li id="a3"><time datetime="2026-03-01">March</time><p>Three</p></li>
			</ol>
		</div>
	</main>
</body>
</html>
