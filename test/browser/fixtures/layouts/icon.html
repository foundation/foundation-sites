<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Icon fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Icon</h1>
		<div id="stage">
			<p>
				<span class="icon" id="icon">
					<svg id="svg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>
					<span id="label">Label</span>
				</span>
			</p>
			<p>
				<span class="icon" id="base" data-align="baseline">
					<svg id="base-svg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>
					<span id="base-label">Label<span id="probe" style="display: inline-block; inline-size: 0; block-size: 0"></span></span>
				</span>
			</p>
		</div>
	</main>
</body>
</html>
