<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cluster fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Cluster</h1>
		<div id="stage">
			<div class="cluster" id="cluster">
				<span class="item" id="c1" style="inline-size: 120px">1</span>
				<span class="item" id="c2" style="inline-size: 120px">2</span>
				<span class="item" id="c3" style="inline-size: 120px">3</span>
				<span class="item" id="c4" style="inline-size: 120px">4</span>
				<span class="item" id="c5" style="inline-size: 120px">5</span>
				<span class="item" id="c6" style="inline-size: 120px">6</span>
				<span class="item" id="c7" style="inline-size: 120px">7</span>
				<span class="item" id="c8" style="inline-size: 120px">8</span>
				<span class="item" id="c9" style="inline-size: 120px">9</span>
				<span class="item" id="c10" style="inline-size: 120px">10</span>
			</div>
			<div class="cluster" id="between" data-justify="between" data-gap="sm">
				<span class="item" id="b1" style="inline-size: 120px">1</span>
				<span class="item" id="b2" style="inline-size: 120px">2</span>
				<span class="item" id="b3" style="inline-size: 120px">3</span>
			</div>
		</div>
	</main>
</body>
</html>
