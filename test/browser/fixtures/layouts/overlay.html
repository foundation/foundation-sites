<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Overlay fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Overlay</h1>
		<div id="stage">
			<div class="overlay" id="host" style="block-size: 300px; background: var(--yeti-color-surface-sunken)">
				<p id="under">The content underneath, in normal flow.</p>
				<p class="item" id="overlay" data-over>Centered over the host</p>
			</div>
			<div class="overlay" id="fixed-host" data-fixed>
				<p>The page underneath.</p>
				<p class="item" id="fixed" data-over hidden>Centered over the viewport</p>
			</div>
		</div>
	</main>
</body>
</html>
