<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Overlay fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; } .item { background: var(--yeti-color-primary-soft); padding: 0.5rem; }</style>
</head>
<body>
	<main>
		<h1>Overlay</h1>
		<div id="stage">
			<div id="host" style="position: relative; block-size: 300px; background: var(--yeti-color-surface-sunken)">
				<p class="overlay item" id="overlay">Centered over the host</p>
			</div>
			<p class="overlay item" id="fixed" data-fixed hidden>Centered over the viewport</p>
		</div>
	</main>
</body>
</html>
