<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Button fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Button component</h1>
		<div id="stage">
			<div class="stack" data-gap="sm">
				<div class="cluster" id="variants">
					<button class="button" type="button" id="primary" data-contrast>Primary</button>
					<button class="button" type="button" id="secondary" data-variant="secondary" data-contrast>Secondary</button>
					<button class="button" type="button" data-variant="success" data-contrast>Success</button>
					<button class="button" type="button" data-variant="warning" data-contrast>Warning</button>
					<button class="button" type="button" data-variant="alert" data-contrast>Alert</button>
					<button class="button" type="button" data-variant="neutral" data-contrast>Neutral</button>
				</div>
				<div class="cluster" id="emphasis">
					<button class="button" type="button" id="medium" data-emphasis="medium" data-contrast>Medium</button>
					<button class="button" type="button" id="low" data-emphasis="low" data-contrast>Low</button>
					<button class="button" type="button" data-variant="alert" data-emphasis="medium" data-contrast>Alert medium</button>
					<button class="button" type="button" data-variant="warning" data-emphasis="low" data-contrast>Warning low</button>
				</div>
				<div class="cluster" id="sizes">
					<button class="button" type="button" id="sm" data-size="sm">Small</button>
					<button class="button" type="button" id="md">Medium</button>
					<button class="button" type="button" id="lg" data-size="lg">Large</button>
				</div>
				<div class="cluster" id="states">
					<button class="button" type="button" id="pressed" aria-pressed="true" data-contrast>Pressed</button>
					<button class="button" type="button" id="pressed-medium" data-emphasis="medium" aria-pressed="true">Pressed medium</button>
					<button class="button" type="button" id="busy" aria-busy="true" aria-disabled="true">Busy</button>
					<button class="button" type="button" id="disabled" disabled>Disabled</button>
					<button class="button" type="button" id="disabled-low" data-emphasis="low" disabled>Disabled low</button>
					<a class="button" href="#" id="link" data-contrast>Link</a>
					<button class="button" type="button" id="icon"><svg id="svg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>Icon</button>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
