<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Seam fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>
		#stage { inline-size: 100%; background: var(--yeti-color-secondary-subtle); padding-block: 1px; }
		/* padding-inline only: a plain "padding" shorthand here would set every
		   physical side including the one the component computes for the cut
		   edge, and unlayered fixture CSS always wins over @layer yeti.components
		   regardless of specificity, silently cancelling the seam's own depth
		   calculation. Give the non-cut edge its baseline padding explicitly so
		   it never competes with the side seam.css owns. */
		.seam { background: var(--yeti-color-primary); color: var(--yeti-on-primary); padding-inline: var(--yeti-space-lg); block-size: 240px; box-sizing: border-box; margin-block-end: 1rem; }
		.seam:not([data-edge="top"], [data-edge="both"]) { padding-block-start: var(--yeti-space-lg); }
		.seam[data-edge="top"] { padding-block-end: var(--yeti-space-lg); }
	</style>
</head>
<body>
	<main>
		<h1>Seam component</h1>
		<div id="stage">
			<section class="seam" id="slant"><p data-contrast>Slant bottom</p></section>
			<section class="seam" id="flip" data-flip><p>Slant bottom flipped</p></section>
			<section class="seam" id="top" data-edge="top"><p>Slant top</p></section>
			<section class="seam" id="both" data-edge="both" data-size="lg"><p>Slant both</p></section>
			<section class="seam" id="curve" data-shape="curve"><p>Curve</p></section>
			<section class="seam" id="wave" data-shape="wave" data-edge="both"><p>Wave both</p></section>
		</div>
	</main>
</body>
</html>
