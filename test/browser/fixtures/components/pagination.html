<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pagination fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Pagination component</h1>
		<div id="stage">
			<nav class="pagination" id="pages" aria-label="Pagination">
				<ol role="list">
					<li><a href="#" rel="prev" id="prev" data-contrast>Previous</a></li>
					<li><a href="#" id="p1" data-contrast>1</a></li>
					<li><a href="#" id="p2" aria-current="page" data-contrast>2</a></li>
					<li><a href="#" id="p3">3</a></li>
					<li><span id="gap">…</span></li>
					<li><a href="#" id="p9">9</a></li>
					<li><a href="#" rel="next" id="next">Next</a></li>
				</ol>
			</nav>
		</div>
	</main>
</body>
</html>
