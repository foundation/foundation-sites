<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Alert fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<script type="module" src="../../../../src/components/alert/alert.js"></script>
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Alert component</h1>
		<div id="stage">
			<div class="alert" role="status" id="medium" data-contrast>
				<svg aria-hidden="true" viewBox="0 0 16 16" id="icon"><path d="M8 3v6M8 12v.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				<div>Medium: a tint of the hue.</div>
			</div>
			<div class="alert" role="status" id="high" data-emphasis="high" data-contrast>
				<div>High: the hue filled in.</div>
			</div>
			<div class="alert" role="status" id="low" data-emphasis="low" data-contrast>
				<div>Low: the border alone.</div>
			</div>
			<div class="alert" role="status" id="success" data-variant="success" data-contrast><div>Success.</div></div>
			<div class="alert" role="status" id="warning" data-variant="warning" data-contrast><div>Warning.</div></div>
			<div class="alert" role="alert" id="danger" data-variant="alert" data-emphasis="high" data-contrast><div>Alert.</div></div>
			<div class="alert" role="status" id="closable" data-variant="neutral">
				<div>A closable notice.</div>
				<button type="button" data-dismiss aria-label="Dismiss" id="dismiss">×</button>
			</div>
		</div>
	</main>
</body>
</html>
