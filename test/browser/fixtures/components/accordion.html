<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accordion fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Accordion component</h1>
		<div id="stage">
			<div class="accordion" id="solo">
				<details id="d1"><summary id="s1" data-contrast>First question</summary><p id="p1">First answer.</p></details>
				<details id="d2" open><summary id="s2" data-contrast>Second question</summary><p id="p2">Second answer.</p></details>
			</div>
			<div class="accordion" id="exclusive">
				<details id="e1" name="group"><summary id="es1">One at a time</summary><p>Only one of these opens.</p></details>
				<details id="e2" name="group"><summary id="es2">The other one</summary><p>Opening this shuts the first.</p></details>
			</div>
		</div>
	</main>
</body>
</html>
