<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nav fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Nav component</h1>
		<div id="stage">
			<nav class="nav" id="nav" aria-label="Site">
				<a href="#" data-brand id="brand">Yeti</a>
				<button type="button" popovertarget="menu" aria-label="Menu" id="toggle">☰</button>
				<ul id="menu" popover role="list">
					<li><a href="#" id="current" aria-current="page" data-contrast>Docs</a></li>
					<li><a href="#" id="plain" data-contrast>Blog</a></li>
					<li><a href="#">About</a></li>
				</ul>
				<div data-actions id="actions"><a class="button" href="#" data-size="sm" data-contrast>Get started</a></div>
			</nav>
			<p>Content below the bar.</p>
		</div>
	</main>
</body>
</html>
