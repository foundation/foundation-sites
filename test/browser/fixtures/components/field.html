<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Field fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Field component</h1>
		<div id="stage">
			<form class="stack" data-gap="md" id="form" novalidate>
				<div class="field" id="text">
					<label for="email" id="email-label" data-contrast>Email</label>
					<input id="email" type="email" required aria-describedby="email-hint email-error">
					<p id="email-hint" data-hint data-contrast>We only use it to sign you in.</p>
					<p id="email-error" data-error>Enter an address with an @ in it.</p>
				</div>
				<div class="field" id="server">
					<label for="name">Name</label>
					<input id="name" type="text" aria-invalid="true" aria-describedby="name-error">
					<p id="name-error" data-error data-contrast>Already taken.</p>
				</div>
				<div class="field" id="pick">
					<label for="colour">Colour</label>
					<select id="colour"><option>Blue</option><option>Green</option></select>
				</div>
				<div class="field" id="notes-field" data-size="lg">
					<label for="notes">Notes</label>
					<textarea id="notes"></textarea>
				</div>
				<div class="field" id="check">
					<input id="agree" type="checkbox" checked>
					<label for="agree" id="agree-label">I agree</label>
				</div>
				<div class="field" id="small" data-size="sm">
					<label for="code">Code</label>
					<input id="code" type="text">
				</div>
				<fieldset class="field" id="set">
					<legend data-contrast>Plan</legend>
					<div class="field"><input id="p-a" type="radio" name="plan" value="a"><label for="p-a">A</label></div>
					<div class="field"><input id="p-b" type="radio" name="plan" value="b"><label for="p-b">B</label></div>
					<p data-hint>One of them.</p>
				</fieldset>
				<button class="button" type="submit">Send</button>
			</form>
		</div>
	</main>
</body>
</html>
