<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Badge fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Badge component</h1>
		<div id="stage">
			<p>
				<span class="badge" id="medium" data-contrast>Medium</span>
				<span class="badge" id="high" data-emphasis="high" data-contrast>High</span>
				<span class="badge" id="low" data-emphasis="low" data-contrast>Low</span>
				<span class="badge" data-variant="success" data-contrast>Success</span>
				<span class="badge" data-variant="warning" data-contrast>Warning</span>
				<span class="badge" data-variant="alert" data-emphasis="high" data-contrast>Alert</span>
				<span class="badge" data-variant="neutral" data-contrast>Neutral</span>
				<span class="badge" id="lg" data-size="lg">Large</span>
			</p>
		</div>
	</main>
</body>
</html>
