<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dropdown fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Dropdown component</h1>
		<div id="stage">
			<div class="dropdown" id="first">
				<button class="button" type="button" popovertarget="menu-one" id="trigger-one" data-emphasis="medium" data-contrast>Account</button>
				<div id="menu-one" popover>
					<a href="#" id="item-one">Profile</a>
					<a href="#">Settings</a>
					<button type="button">Sign out</button>
				</div>
			</div>
			<div class="dropdown" id="second" data-side="end">
				<button class="button" type="button" popovertarget="menu-two" id="trigger-two" data-emphasis="medium">More</button>
				<div id="menu-two" popover>
					<a href="#" id="item-two">Duplicate</a>
					<button type="button">Archive</button>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
