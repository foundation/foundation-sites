<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dialog fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<script type="module" src="../../../../src/components/dialog/dialog.js"></script>
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Dialog component</h1>
		<div id="stage">
			<button class="button" type="button" data-open="confirm" id="opener" data-contrast>Delete project</button>
			<p><a href="#" id="after">A link after the button.</a></p>

			<dialog class="dialog" id="confirm" aria-labelledby="confirm-title">
				<h2 id="confirm-title">Delete this project?</h2>
				<p>Everything in it goes too.</p>
				<footer>
					<form method="dialog"><button class="button" type="submit" id="cancel" data-emphasis="medium">Cancel</button></form>
					<button class="button" type="button" id="confirm-go" data-variant="alert">Delete</button>
					<button class="button" type="button" data-open="nested" id="nested-open" data-emphasis="low">Are you sure?</button>
				</footer>
			</dialog>

			<dialog class="dialog" id="nested" aria-labelledby="nested-title" data-width="sm">
				<h2 id="nested-title">Really delete?</h2>
				<footer>
					<form method="dialog"><button class="button" type="submit" id="nested-cancel">No</button></form>
				</footer>
			</dialog>
		</div>
	</main>
</body>
</html>
