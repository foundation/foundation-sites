<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spinner fixture</title>
	<link rel="stylesheet" href="../../../../src/yeti.css">
	<style>#stage { inline-size: 100%; }</style>
</head>
<body>
	<main>
		<h1>Spinner component</h1>
		<div id="stage">
			<p id="line"><span class="spinner" id="spin" role="status" aria-label="Loading"></span> Loading</p>
			<p><span class="spinner" id="lg" data-size="lg" role="status" aria-label="Loading"></span></p>
			<p><button class="button" id="busy" aria-busy="true" aria-disabled="true">Saving</button></p>
		</div>
	</main>
</body>
</html>
